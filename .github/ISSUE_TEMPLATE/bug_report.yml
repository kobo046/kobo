name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Do not attach private backups or secret credentials.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Enter...
        3. See...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - GitHub Pages website
        - Local website
        - iOS app
        - Supabase synchronization
        - Tests or developer tooling
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser/app version
      placeholder: iPhone 15, iOS 26, installed app build 1
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add screenshots or anonymized sample data. Remove names and credentials.
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, API secrets, private backups, and personal information.
          required: true
